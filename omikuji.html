<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                        cute: ['Quicksand', '"Zen Maru Gothic"', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#FFD1DC',
                            purple: '#E2CEF7',
                            blue: '#B5E2FA',
                            yellow: '#FFF5BA',
                            mint: '#C1F0C8',
                            darkPurple: '#5E4B8B'
                        }

                    animation: {
                        'bounce-short': 'bounce 0.5s ease-in-out 1',
                        'sparkle': 'sparkle 2s infinite ease-in-out',
                        'float': 'float 3s infinite ease-in-out',
                    },
                    keyframes: {
                        sparkle: {
                            '0%, 100%': { opacity: 0.3, transform: 'scale(0.8)' },
                            '50%': { opacity: 1, transform: 'scale(1.2)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {

            background: linear-gradient(135deg, #FFF0F5 0%, #E6E6FA 50%, #F0F8FF 100%);
            touch-action: manipulation;
        }
        
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBA6EC;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A074C9;
        }

        /* アイテム選択時の光る枠線 */
        .item-card {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .item-card:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .item-card.active {
            border-color: #9333EA;
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
            transform: translateY(-2px);
        }

        /* カラーピッカー円形の影 */
        .color-dot {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .color-dot:hover {
            transform: scale(1.25);
        }
        .color-dot.active {
            transform: scale(1.2);
            box-shadow: 0 0 0 3px white, 0 0 0 5px #9333EA;
        }
    </style>
</head>

    <script>
        // 音響効果 (Web Audio API)
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'equip') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'camera') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.setValueAtTime(400, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) { console.error(e); }
        }

            bodyGroup.innerHTML = `

                <!-- 首 -->
                <rect x="190" y="265" width="20" height="30" rx="5" fill="${currentOutfit.skin}" />
                <!-- 体・素体 (ウエスト〜ヒップ) -->
                <path d="M 165 280 Q 155 310 162 345 Q 170 355 200 355 Q 230 355 238 345 Q 245 310 235 280 Z" fill="${currentOutfit.skin}" />
                <!-- 腕 (左・右) -->
                <path d="M 160 285 Q 135 340 140 400" stroke="${currentOutfit.skin}" stroke-width="20" stroke-linecap="round" fill="none" />
                <path d="M 240 285 Q 265 340 260 400" stroke="${currentOutfit.skin}" stroke-width="20" stroke-linecap="round" fill="none" />
                <!-- 脚 (左・右: ヒップから足先までしっかり描画) -->
                <rect x="168" y="340" width="25" height="205" rx="12" fill="${currentOutfit.skin}" />
                <rect x="207" y="340" width="25" height="205" rx="12" fill="${currentOutfit.skin}" />
            `;

            // 後ろ髪
            const backHairGroup = document.getElementById('layer-back-hair');
            let backHairSvg = '';
            if (currentOutfit.hairStyle === 'long') {
                backHairSvg = `
                    <!-- 頭頂部〜全体ベース -->
                    <path d="M 125 180 Q 120 110 200 108 Q 280 110 275 180 Q 285 320 270 450 Q 200 475 130 450 Q 115 320 125 180 Z" fill="${currentOutfit.hairColor}" />
                `;
            } else if (currentOutfit.hairStyle === 'twintail') {
                backHairSvg = `
                    <!-- 頭頂部ベース -->
                    <path d="M 130 180 Q 125 110 200 108 Q 275 110 270 180 Q 265 220 135 220 Z" fill="${currentOutfit.hairColor}" />
                    <!-- 左右のツインテール束 -->
                    <path d="M 140 190 C 80 230 60 360 100 420 C 125 380 140 280 150 210 Z" fill="${currentOutfit.hairColor}" />
                    <path d="M 260 190 C 320 230 340 360 300 420 C 275 380 260 280 250 210 Z" fill="${currentOutfit.hairColor}" />

            } else if (currentOutfit.hairStyle === 'bob') {
                backHairSvg = `

                    <circle cx="265" cy="115" r="32" fill="${currentOutfit.hairColor}" />
                    <!-- 頭頂部ベース -->
                    <path d="M 130 180 Q 125 112 200 110 Q 275 112 270 180 Q 265 225 135 225 Z" fill="${currentOutfit.hairColor}" />
                `;
            } else if (currentOutfit.hairStyle === 'short') {
                backHairSvg = `
                    <!-- ベリーショート頭頂部〜全頭ベース -->
                    <path d="M 126 190 Q 120 108 200 105 Q 280 108 274 190 Q 275 235 260 245 Q 200 230 140 245 Q 125 235 126 190 Z" fill="${currentOutfit.hairColor}" />
                `;
            }
            backHairGroup.innerHTML = backHairSvg;

            // 表情（眉、目、口、チーク）
            const expGroup = document.getElementById('layer-expression');
            let expSvg = '';
            const eyeColor = currentOutfit.eyeColor;

            if (currentOutfit.expression === 'shy') {
                // --- 照れ顔 ---

                    <!-- 濃いめチーク ＆ 照れ斜め線 -->
                    <ellipse cx="158" cy="222" rx="15" ry="8" fill="#FF6B81" opacity="0.65" />

        // --- UI構築＆イベントハンドラー ---

        // カテゴリタブ描画
        function renderCategoryTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="switchCategory('${cat.id}')" 
                    class="px-3.5 py-2 rounded-2xl text-xs md:text-sm font-bold flex items-center space-x-1.5 whitespace-nowrap transition-all ${
                        activeCategory === cat.id 
                            ? 'bg-white text-purple-700 shadow-md transform scale-105 border border-purple-200' 
                            : 'text-gray-500 hover:text-purple-600 hover:bg-white/50'
                    }">
                    <span>${cat.icon}</span>
                    <span>${cat.name}</span>
                </button>
            `).join('');
        }

        // カテゴリ切り替え
        function switchCategory(catId) {
            playSound('click');
            activeCategory = catId;
            renderCategoryTabs();
            renderColorPicker();
            renderItemGrid();
            
            const catObj = categories.find(c => c.id === catId);
            document.getElementById('active-category-name').textContent = catObj ? catObj.name : '';
        }

        // カラーピッカー描画
        function renderColorPicker() {
            const catObj = categories.find(c => c.id === activeCategory);
            const container = document.getElementById('part-color-picker');
            const colorBar = document.getElementById('color-bar-container');

            if (!catObj || !catObj.hasColor) {
                colorBar.classList.add('hidden');
                return;
            }
            colorBar.classList.remove('hidden');

            const paletteType = catObj.hasColor;
            const colors = colorPalettes[paletteType] || colorPalettes.clothes;

            // 現在選択中のパーツのカラーを取得
            let currentColor = '#FFFFFF';
            if (activeCategory === 'hair') currentColor = currentOutfit.hairColor;
            else if (activeCategory === 'expression') currentColor = currentOutfit.eyeColor;
            else if (activeCategory === 'tops') currentColor = currentOutfit.topsColor;
            else if (activeCategory === 'bottoms') currentColor = currentOutfit.bottomsColor;
            else if (activeCategory === 'dress') currentColor = currentOutfit.dressColor;
            else if (activeCategory === 'shoes') currentColor = currentOutfit.shoesColor;
            else if (activeCategory === 'acc') currentColor = currentOutfit.accColor;

            container.innerHTML = colors.map(c => `
                <button onclick="selectColor('${c}')" 
                    class="w-6 h-6 rounded-full border border-black/10 color-dot flex-shrink-0 ${currentColor === c ? 'active' : ''}" 
                    style="background-color: ${c}">
                </button>
            `).join('');
        }

        // カラー選択
        function selectColor(color) {
            playSound('click');
            if (activeCategory === 'hair') currentOutfit.hairColor = color;
            else if (activeCategory === 'expression') currentOutfit.eyeColor = color;
            else if (activeCategory === 'tops') currentOutfit.topsColor = color;
            else if (activeCategory === 'bottoms') currentOutfit.bottomsColor = color;
            else if (activeCategory === 'dress') currentOutfit.dressColor = color;
            else if (activeCategory === 'shoes') currentOutfit.shoesColor = color;
            else if (activeCategory === 'acc') currentOutfit.accColor = color;

            renderColorPicker();
            renderCharacter();
        }

        // 肌色ピッカー初期化
        function initSkinPicker() {
            const container = document.getElementById('skin-color-picker');
            container.innerHTML = skinColors.map(c => `
                <button onclick="selectSkin('${c}')" 
                    class="w-6 h-6 rounded-full border border-black/10 color-dot ${currentOutfit.skin === c ? 'active' : ''}" 
                    style="background-color: ${c}">
                </button>
            `).join('');
        }

        function selectSkin(color) {
            playSound('click');
            currentOutfit.skin = color;
            initSkinPicker();
            renderCharacter();
        }

        // アイテムグリッド描画
        function renderItemGrid() {
            const container = document.getElementById('item-grid');
            const items = categoryItems[activeCategory] || [];

            // 現在選択中のアイテムID
            let activeId = 'none';
            if (activeCategory === 'hair') activeId = currentOutfit.hairStyle;
            else if (activeCategory === 'expression') activeId = currentOutfit.expression;
            else if (activeCategory === 'tops') activeId = currentOutfit.tops;
            else if (activeCategory === 'bottoms') activeId = currentOutfit.bottoms;
            else if (activeCategory === 'dress') activeId = currentOutfit.dress;
            else if (activeCategory === 'shoes') activeId = currentOutfit.shoes;
            else if (activeCategory === 'acc') activeId = currentOutfit.acc;
            else if (activeCategory === 'bg') activeId = currentOutfit.bg;

            container.innerHTML = items.map(item => {
                const isActive = activeId === item.id;
                let previewContent = `<span class="text-3xl">${item.icon || '✨'}</span>`;
                if (activeCategory === 'bg') {
                    previewContent = `<div class="w-8 h-8 rounded-full shadow-inner" style="background:${item.color}"></div>`;
                }

                return `
                    <button onclick="selectItem('${item.id}')" 
                        class="item-card p-3 rounded-2xl bg-white border-2 border-purple-50 flex flex-col items-center justify-center space-y-2 cursor-pointer ${isActive ? 'active' : ''}">
                        ${previewContent}
                        <span class="text-xs font-bold text-gray-700 text-center truncate w-full">${item.name}</span>
                    </button>
                `;
            }).join('');

            // ステータス表示
            const activeItemObj = items.find(i => i.id === activeId);
            document.getElementById('selected-item-count').textContent = `選択中: ${activeItemObj ? activeItemObj.name : 'なし'}`;
        }

        // アイテム装備
        function selectItem(itemId) {
            playSound('equip');
            if (activeCategory === 'hair') currentOutfit.hairStyle = itemId;
            else if (activeCategory === 'expression') currentOutfit.expression = itemId;
            else if (activeCategory === 'tops') {
                currentOutfit.tops = itemId;
                if (itemId !== 'none') currentOutfit.dress = 'none'; // ワンピース解除
            }
            else if (activeCategory === 'bottoms') {
                currentOutfit.bottoms = itemId;
                if (itemId !== 'none') currentOutfit.dress = 'none'; // ワンピース解除
            }
            else if (activeCategory === 'dress') {
                currentOutfit.dress = itemId;
                if (itemId !== 'none') {
                    currentOutfit.tops = 'none';
                    currentOutfit.bottoms = 'none';
                }
            }
            else if (activeCategory === 'shoes') currentOutfit.shoes = itemId;
            else if (activeCategory === 'acc') currentOutfit.acc = itemId;
            else if (activeCategory === 'bg') currentOutfit.bg = itemId;

            renderItemGrid();
            renderCharacter();
        }

        // おまかせランダムコーデ
        function randomizeOutfit() {
            playSound('equip');
            const getRandom = arr => arr[Math.floor(Math.random() * arr.length)];

            currentOutfit.skin = getRandom(skinColors);
            currentOutfit.hairStyle = getRandom(categoryItems.hair).id;
            currentOutfit.hairColor = getRandom(colorPalettes.hair);
            currentOutfit.expression = getRandom(categoryItems.expression).id;
            currentOutfit.eyeColor = getRandom(colorPalettes.eyes);

            // ドレス or (トップス+ボトムス)
            if (Math.random() > 0.5) {
                currentOutfit.dress = getRandom(categoryItems.dress.filter(i => i.id !== 'none')).id;
                currentOutfit.tops = 'none';
                currentOutfit.bottoms = 'none';
            } else {
                currentOutfit.dress = 'none';
                currentOutfit.tops = getRandom(categoryItems.tops.filter(i => i.id !== 'none')).id;
                currentOutfit.bottoms = getRandom(categoryItems.bottoms.filter(i => i.id !== 'none')).id;
            }

            currentOutfit.topsColor = getRandom(colorPalettes.clothes);
            currentOutfit.bottomsColor = getRandom(colorPalettes.clothes);
            currentOutfit.dressColor = getRandom(colorPalettes.clothes);

            currentOutfit.shoes = getRandom(categoryItems.shoes).id;
            currentOutfit.shoesColor = getRandom(colorPalettes.clothes);

            currentOutfit.acc = getRandom(categoryItems.acc).id;
            currentOutfit.accColor = getRandom(colorPalettes.clothes);

            currentOutfit.bg = getRandom(categoryItems.bg).id;

            initSkinPicker();
            renderColorPicker();
            renderItemGrid();
            renderCharacter();
        }

        // リセット
        function resetOutfit() {
            playSound('click');
            currentOutfit.skin = '#FFE0D0';
            currentOutfit.hairStyle = 'long';
            currentOutfit.hairColor = '#4A3728';
            currentOutfit.expression = 'smile';
            currentOutfit.eyeColor = '#4B2E83';
            currentOutfit.tops = 'tshirt';
            currentOutfit.topsColor = '#FFB6C1';
            currentOutfit.bottoms = 'skirt';
            currentOutfit.bottomsColor = '#B5E2FA';
            currentOutfit.dress = 'none';
            currentOutfit.dressColor = '#E2CEF7';
            currentOutfit.shoes = 'sneakers';
            currentOutfit.shoesColor = '#FFFFFF';
            currentOutfit.acc = 'ribbon';
            currentOutfit.accColor = '#FF6B6B';
            currentOutfit.bg = 'pastel';

            initSkinPicker();
            renderColorPicker();
            renderItemGrid();
            renderCharacter();
        }

        // スナップショット撮影 (SVG -> Canvas -> PNG)
        function takeSnapshot() {
            playSound('camera');
            const stage = document.getElementById('stage-container');
            const svgElement = document.getElementById('character-svg');
            
            // キャンバス生成
            const canvas = document.createElement('canvas');
            const width = 600;
            const height = 800;
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // 背景描画
            const bgObj = categoryItems.bg.find(b => b.id === currentOutfit.bg);
            const grad = ctx.createLinearGradient(0, 0, width, height);
            if (currentOutfit.bg === 'night') {
                grad.addColorStop(0, '#2D1B69');
                grad.addColorStop(1, '#9B51E0');
            } else if (currentOutfit.bg === 'mint') {
                grad.addColorStop(0, '#C1F0C8');
                grad.addColorStop(1, '#B5E2FA');
            } else if (currentOutfit.bg === 'sunset') {
                grad.addColorStop(0, '#FF7A00');
                grad.addColorStop(1, '#FFB6C1');
            } else if (currentOutfit.bg === 'room') {
                grad.addColorStop(0, '#FFF5BA');
                grad.addColorStop(1, '#FFD1DC');
            } else {
                grad.addColorStop(0, '#FFD1DC');
                grad.addColorStop(1, '#E2CEF7');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // キラキラデコレーション描画
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "28px sans-serif";
            ctx.fillText("✨", 40, 60);
            ctx.fillText("💖", width - 60, height - 50);
            ctx.fillText("⭐", width - 50, 100);

            // SVG文字列を取得してImage化
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);

            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(blobURL);

                // 画像データ変換＆モーダル表示
                const dataUrl = canvas.toDataURL('image/png');
                document.getElementById('snapshot-img').src = dataUrl;
                document.getElementById('download-link').href = dataUrl;
                
                // モーダルオープン
                const modal = document.getElementById('photo-modal');
                const content = document.getElementById('photo-modal-content');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);
            };
            img.src = blobURL;
        }

        function closePhotoModal() {
            playSound('click');
            const modal = document.getElementById('photo-modal');
            const content = document.getElementById('photo-modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // 初期化処理
        window.onload = function() {
            renderCategoryTabs();
            renderColorPicker();
            initSkinPicker();
            renderItemGrid();
            renderCharacter();
        };
    </script>
</body>
</html>
